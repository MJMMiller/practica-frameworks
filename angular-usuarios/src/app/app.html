@if (loading()) {
  <p>Cargando…</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <main class="app">
    <h1>Lista de usuarios</h1>
    <p>Favoritos: {{ favorites().length }}</p>

    <input
      type="search"
      placeholder="Buscar por nombre"
      #box
      (input)="search.set(box.value)"
    />

    <section class="tarjetas">
      @for (user of visibleUsers(); track user.id) {
        <app-user-card
          [user]="user"
          [isFavorite]="favorites().includes(user.id)"
          (favorite)="toggleFavorite($event)"
        />
      }
    </section>
  </main>
}
